name: Gemini Assistant
on:
  issue_comment:
    types: [created]

jobs:
  gemini_assistant:
    if: startsWith(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import json

          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()
          github_token = os.environ.get('GITHUB_TOKEN', '').strip()
          issue_num = os.environ.get('ISSUE_NUMBER')
          comment = os.environ.get('COMMENT_BODY', '')
          repo_name = os.environ.get('REPO_NAME')

          user_prompt = comment.replace('/gemini', '', 1).strip()

          # เปลี่ยนมาใช้โมเดล gemini-3.8-flash ตามคำแนะนำของ API
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={gemini_key}"
          headers = {"Content-Type": "application/json"}
          payload = {
              "contents": [{
                  "parts": [{"text": f"คุณคือ AI ผู้ช่วยพัฒนาโปรเจกต์ 'FF9 Audio-Book' บน GitHub โปรดตอบคำถามหรือให้คำแนะนำตามคำขอนี้:\n\n{user_prompt}"}]
              }]
          }

          res = requests.post(url, headers=headers, json=payload)
          if res.status_code == 200:
              data = res.json()
              reply_text = data['candidates'][0]['content']['parts'][0]['text']
          else:
              reply_text = f"เกิดข้อผิดพลาดในการเรียก Gemini API (HTTP {res.status_code}): {res.text}"

          gh_url = f"https://api.github.com/repos/{repo_name}/issues/{issue_num}/comments"
          gh_headers = {
              "Authorization": f"token {github_token}",
              "Accept": "application/vnd.github.v3+json"
          }
          gh_payload = {"body": f"### 🤖 Gemini Response:\n\n{reply_text}"}
          requests.post(gh_url, headers=gh_headers, json=gh_payload)
          EOF
