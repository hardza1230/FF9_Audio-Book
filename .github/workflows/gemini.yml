name: Gemini Assistant & Auto Commit
on:
  issue_comment:
    types: [created]

jobs:
  gemini_assistant:
    if: startsWith(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_NAME: ${{ github.repository }}
        run: |
          cat << 'PYEOF' > run_agent.py
          import os, json, requests, subprocess, re

          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()
          github_token = os.environ.get('GITHUB_TOKEN', '').strip()
          issue_num = os.environ.get('ISSUE_NUMBER')
          comment = os.environ.get('COMMENT_BODY', '')
          repo_name = os.environ.get('REPO_NAME')

          user_prompt = comment.replace('/gemini', '', 1).strip()
          system_instruction = (
              "คุณคือ AI ผู้ช่วยสร้าง FF9 Audio-Book\n"
              "ตอบกลับในรูปแบบ JSON เท่านั้น โดยต้องครอบ String ทั้งหมดด้วยเครื่องหมาย double-quote เสมอ:\n"
              "{\n"
              '  "reply": "ข้อความอธิบายสรุปสั้นๆ ภาษาไทย",\n'
              '  "files": [\n'
              '    {"path": "โฟลเดอร์/ชื่อไฟล์.json", "content": "เนื้อหาของไฟล์"}\n'
              "  ]\n"
              "}"
          )

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={gemini_key}"
          payload = {
              "system_instruction": {"parts": [{"text": system_instruction}]},
              "contents": [{"parts": [{"text": user_prompt}]}],
              "generationConfig": {
                  "response_mime_type": "application/json",
                  "maxOutputTokens": 8192,
                  "temperature": 0.2
              }
          }

          res = requests.post(url, headers={"Content-Type": "application/json"}, json=payload)
          created_files = []
          reply_text = ""

          if res.status_code == 200:
              try:
                  data = res.json()
                  candidate = data['candidates'][0]
                  raw_text = candidate['content']['parts'][0]['text']

                  # ตรวจสอบว่าข้อความถูกตัดเพราะความยาวเกินหรือไม่
                  finish_reason = candidate.get("finishReason", "")
                  if finish_reason == "MAX_TOKENS":
                      reply_text = "⚠️ คำตอบยาวเกินขีดจำกัดสูงสุดของโมเดล ทำให้ไฟล์ JSON ไม่สมบูรณ์ แนะนำให้แบ่งสั่งทีละองก์/ช่วงย่อยครับ"
                  else:
                      parsed = json.loads(raw_text)
                      reply_text = parsed.get("reply", "")

                      for f in parsed.get("files", []):
                          p = f.get("path")
                          if p:
                              d = os.path.dirname(p)
                              if d: os.makedirs(d, exist_ok=True)
                              with open(p, "w", encoding="utf-8") as out:
                                  out.write(f.get("content", ""))
                              created_files.append(p)

                      if created_files:
                          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
                          subprocess.run(["git", "add", "."], check=True)
                          diff = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
                          if diff.stdout.strip():
                              subprocess.run(["git", "commit", "-m", f"Auto-create files via Issue #{issue_num}"], check=True)
                              subprocess.run(["git", "push"], check=True)
                              reply_text += "\n\n---\n📁 **สร้างและ Push ไฟล์สำเร็จ:**\n" + "\n".join([f"- `{x}`" for x in created_files])

                  usage = data.get("usageMetadata", {})
                  prompt_tokens = usage.get("promptTokenCount", 0)
                  candidates_tokens = usage.get("candidatesTokenCount", 0)
                  total_tokens = usage.get("totalTokenCount", 0)

                  reply_text += (
                      f"\n\n---\n"
                      f"📊 **สรุปการใช้ Token:** Input: `{prompt_tokens}` | Output: `{candidates_tokens}` | Total: `{total_tokens}`"
                  )

              except Exception as e:
                  reply_text = f"เกิดข้อผิดพลาดในการประมวลผล JSON: {e}\n(แนะนำให้ลองสั่งย่อยขอบเขตให้แคบลง เช่น แบ่งเป็นครึ่งแรกและครึ่งหลัง)"
          else:
              reply_text = f"API Error (HTTP {res.status_code}): {res.text}"

          gh_url = f"https://api.github.com/repos/{repo_name}/issues/{issue_num}/comments"
          requests.post(gh_url, headers={"Authorization": f"token {github_token}"}, json={"body": f"### 🤖 Gemini Response:\n\n{reply_text}"})
          PYEOF
          python run_agent.py
